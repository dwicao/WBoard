name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble signed release APK (AOSP testkey)
        run: ./gradlew assembleRelease

      - name: Verify AOSP testkey signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          echo "$CERTS" | grep -q "a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wboard-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
