name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK signed with AOSP testkey
        run: ./gradlew assembleRelease

      - name: Verify AOSP testkey signature and checksum
        id: pkg
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          echo "$CERTS" | grep -q "a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"

          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([0-9.]+)".*/\1/')
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG="${{ inputs.tag }}"
            [[ -n "$TAG" ]] || TAG="v${VERSION}"
          fi

          mkdir -p out
          OUT="out/WBoard-${TAG}-release.apk"
          cp "$APK" "$OUT"
          ( cd out && sha256sum "WBoard-${TAG}-release.apk" > "WBoard-${TAG}-release.apk.sha256" )
          ls -lh out/
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=out/WBoard-${TAG}-release.apk.sha256" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: WBoard ${{ steps.pkg.outputs.tag }}
          generate_release_notes: true
          body: |
            Minimalist, lightweight, privacy-first Android keyboard with native in-app Indonesian (`id-ID`) voice input and on-device text prediction.

            - Signed with the standard AOSP `testkey` (`a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc`)
            - Zero `INTERNET` permission
          files: |
            ${{ steps.pkg.outputs.apk }}
            ${{ steps.pkg.outputs.sha }}
          draft: false
          prerelease: false
